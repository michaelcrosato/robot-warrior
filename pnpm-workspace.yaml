# pnpm 12 moved package-level settings out of package.json ("the pnpm field in
# package.json is no longer read"). No dependency needs an install script today — Vite 8
# bundles with rolldown, which ships prebuilt binaries, and esbuild is no longer installed —
# so the list is empty. A dependency that later needs one must be approved here by name,
# never by blanket approval.
onlyBuiltDependencies: []
